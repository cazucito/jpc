<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Space+Mono:wght@400;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/jpc.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico"/>
    <title>JPCanvas</title>
  </head>
  <body>
    <main class="app-shell">

      <header class="topbar">
        <div class="brand-wrap">
          <h1 id="mainTitle" class="brand-title">JPCanvas</h1>
          <p class="brand-subtitle">Generative line art</p>
        </div>
        <div class="palette-section">
          <nav class="controls" aria-label="Render presets">
            <!-- palette chips injected dynamically from ColorRegistry — see js/app.js -->
          </nav>
          <div id="custom-colors-panel" class="custom-colors-panel">
            <div class="color-pickers">
              <div class="color-picker-wrapper">
                <input id="custom-color-1" type="color" value="#000000" class="color-picker" title="Primary">
                <span class="color-label">Primary</span>
              </div>
              <div class="color-picker-wrapper">
                <input id="custom-color-2" type="color" value="#ffffff" class="color-picker" title="Secondary">
                <span class="color-label">Secondary</span>
              </div>
              <div class="color-picker-wrapper">
                <input id="custom-color-3" type="color" value="#ff0000" class="color-picker" title="Accent">
                <span class="color-label">Accent</span>
              </div>
            </div>
          </div>
        </div>
      </header>

      <section class="canvas-card" aria-live="polite">
        <div id="containerCanvas" class="canvas-container">
          <canvas id="jpcanvas">NOT SUPPORTED</canvas>
        </div>

        <div class="placard">
          <div class="placard-meta">
            <span class="placard-label">Algorithmic composition</span>
            <span id="render-status" class="status-badge is-hidden">
              <span class="status-dot"></span>Rendering
            </span>
          </div>

          <div class="controls-panel" aria-label="Render controls">
            <label class="control-item">
              <span class="control-label">Lines</span>
              <input id="line-count" type="range" min="0" max="18000" step="500" value="9000">
              <span id="line-count-value" class="control-value">9000</span>
            </label>

            <label class="control-item">
              <span class="control-label">Stroke</span>
              <input id="stroke-width" type="range" min="1" max="4" step="1" value="2">
              <span id="stroke-width-value" class="control-value">2</span>
            </label>

            <label class="control-item">
              <span class="control-label">Engine</span>
              <select id="stroke-engine" class="engine-select">
                <option value="brush">Brush</option>
                <option value="pen">Pen</option>
                <option value="pencil">Pencil</option>
                <option value="marker">Marker</option>
                <option value="spray">Spray</option>
              </select>
            </label>

            <button id="reset-defaults" type="button" class="btn-reset">Reset</button>
            <button id="download-art" type="button" class="btn-download" title="Descargar obra como PNG">&#x2193; Download</button>
            <button id="share-config" type="button" class="btn-share" title="Copiar URL para compartir">&#x1F4E4; Share</button>
          </div>
        </div>
      </section>

      <footer class="site-footer">
        <span>&copy; cazucito</span>
        <a href="https://github.com/cazucito/jpc" target="_blank" rel="noopener noreferrer">GitHub</a>
      </footer>

    </main>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
