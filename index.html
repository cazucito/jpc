<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Space+Mono:wght@400;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/jpc.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico"/>
    <title>JPCanvas</title>
  </head>
  <body>
    <main class="app-shell">

      <header class="topbar">
        <div class="brand-wrap">
          <h1 id="mainTitle" class="brand-title">JPCanvas</h1>
          <p class="brand-subtitle">Generative line art</p>
        </div>
        <div class="palette-section">
          <nav class="controls" aria-label="Render presets">
            <!-- palette chips injected dynamically from ColorRegistry — see js/app.js -->
          </nav>
          <div id="custom-colors-panel" class="custom-colors-panel">
            <div class="color-pickers">
              <div class="color-picker-wrapper">
                <input id="custom-color-1" type="color" value="#000000" class="color-picker" title="Primary">
                <span class="color-label">Primary</span>
              </div>
              <div class="color-picker-wrapper">
                <input id="custom-color-2" type="color" value="#ffffff" class="color-picker" title="Secondary">
                <span class="color-label">Secondary</span>
              </div>
              <div class="color-picker-wrapper">
                <input id="custom-color-3" type="color" value="#ff0000" class="color-picker" title="Accent">
                <span class="color-label">Accent</span>
              </div>
            </div>
          </div>
        </div>
      </header>

      <!-- Mobile Controls Toggle -->
      <button id="mobile-controls-toggle" type="button" class="mobile-controls-toggle" aria-label="Open controls" aria-expanded="false" aria-controls="mobile-bottom-sheet">
        <span class="toggle-icon">⚙️</span>
        <span class="toggle-text">Controls</span>
      </button>

      <!-- Mobile Palettes Toggle -->
      <button id="mobile-palettes-toggle" type="button" class="mobile-palettes-toggle" aria-label="Open palettes" aria-expanded="false" aria-controls="mobile-palettes-sheet">
        <span class="toggle-icon">🎨</span>
        <span class="toggle-text">Palettes</span>
      </button>

      <section class="canvas-card" aria-live="polite">
        <div id="containerCanvas" class="canvas-container">
          <canvas id="jpcanvas">NOT SUPPORTED</canvas>
        </div>

        <div class="placard">
          <div class="placard-meta">
            <span class="placard-label">Algorithmic composition</span>
            <span id="render-status" class="status-badge is-hidden">
              <span class="status-dot"></span>Rendering
            </span>
          </div>

          <div class="controls-panel" aria-label="Render controls">
            <label class="control-item">
              <span class="control-label">Lines</span>
              <input id="line-count" type="range" min="1000" max="12000" step="250" value="6000">
              <span id="line-count-value" class="control-value">6000</span>
            </label>

            <label class="control-item">
              <span class="control-label">Stroke</span>
              <input id="stroke-width" type="range" min="1" max="6" step="1" value="3">
              <span id="stroke-width-value" class="control-value">3</span>
            </label>

            <label class="control-item">
              <span class="control-label">Engine</span>
              <select id="stroke-engine" class="engine-select">
                <option value="brush">Brush</option>
                <option value="pen">Pen</option>
                <option value="pencil">Pencil</option>
                <option value="marker">Marker</option>
                <option value="charcoal">Charcoal</option>
              </select>
            </label>

            <button id="randomize-config" type="button" class="btn-random" title="Configuración aleatoria">&#x1F3B2; Random</button>
            <button id="reset-defaults" type="button" class="btn-reset">Reset</button>
            <button id="download-art" type="button" class="btn-download" title="Descargar obra como PNG">&#x2193; Download</button>
            <button id="share-config" type="button" class="btn-share" title="Copiar URL para compartir">&#x1F4E4; Share</button>
          </div>
        </div>
      </section>

      <!-- Mobile Bottom Sheet -->
      <div id="mobile-bottom-sheet" class="mobile-bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="bottom-sheet-title" aria-hidden="true">
        <div class="bottom-sheet-backdrop"></div>
        <div class="bottom-sheet-content">
          <div class="bottom-sheet-handle" role="button" tabindex="0" aria-label="Swipe down to close">
            <span class="handle-bar"></span>
          </div>
          <div class="bottom-sheet-header">
            <h3 id="bottom-sheet-title" class="bottom-sheet-title">Controls</h3>
            <button id="close-bottom-sheet" type="button" class="bottom-sheet-close" aria-label="Close">✕</button>
          </div>
          <div class="bottom-sheet-body">
            <div class="mobile-controls">
              <label class="mobile-control-item">
                <span class="mobile-control-label">Lines</span>
                <div class="mobile-control-slider">
                  <input id="mobile-line-count" type="range" min="1000" max="12000" step="250" value="6000">
                  <span id="mobile-line-count-value" class="mobile-control-value">6000</span>
                </div>
              </label>

              <label class="mobile-control-item">
                <span class="mobile-control-label">Stroke</span>
                <div class="mobile-control-slider">
                  <input id="mobile-stroke-width" type="range" min="1" max="6" step="1" value="3">
                  <span id="mobile-stroke-width-value" class="mobile-control-value">3</span>
                </div>
              </label>

              <label class="mobile-control-item">
                <span class="mobile-control-label">Engine</span>
                <select id="mobile-stroke-engine" class="mobile-engine-select">
                  <option value="brush">Brush</option>
                  <option value="pen">Pen</option>
                  <option value="pencil">Pencil</option>
                  <option value="marker">Marker</option>
                  <option value="charcoal">Charcoal</option>
                </select>
              </label>

              <div class="mobile-actions-grid">
                <button id="mobile-randomize" type="button" class="mobile-btn mobile-btn-random">🎲 Random</button>
                <button id="mobile-reset" type="button" class="mobile-btn mobile-btn-reset">Reset</button>
                <button id="mobile-download" type="button" class="mobile-btn mobile-btn-download">⬇ Download</button>
                <button id="mobile-share" type="button" class="mobile-btn mobile-btn-share">⬆ Share</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Mobile Palettes Bottom Sheet -->
      <div id="mobile-palettes-sheet" class="mobile-bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="palettes-sheet-title" aria-hidden="true">
        <div class="bottom-sheet-backdrop"></div>
        <div class="bottom-sheet-content">
          <div class="bottom-sheet-handle" role="button" tabindex="0" aria-label="Swipe down to close">
            <span class="handle-bar"></span>
          </div>
          <div class="bottom-sheet-header">
            <h3 id="palettes-sheet-title" class="bottom-sheet-title">Palettes</h3>
            <button id="close-palettes-sheet" type="button" class="bottom-sheet-close" aria-label="Close">✕</button>
          </div>
          <div class="bottom-sheet-body">
            <div id="mobile-palettes-grid" class="mobile-palettes-grid">
              <!-- Palettes injected dynamically -->
            </div>
            <div id="mobile-custom-palette" class="mobile-custom-palette">
              <h4 class="mobile-custom-title">Custom</h4>
              <div class="mobile-color-pickers">
                <div class="mobile-color-picker-wrapper">
                  <input id="mobile-custom-color-1" type="color" value="#000000" class="mobile-color-picker" title="Primary" aria-labelledby="mobile-custom-color-1-label">
                  <span id="mobile-custom-color-1-label" class="mobile-color-label">Primary</span>
                </div>
                <div class="mobile-color-picker-wrapper">
                  <input id="mobile-custom-color-2" type="color" value="#ffffff" class="mobile-color-picker" title="Secondary" aria-labelledby="mobile-custom-color-2-label">
                  <span id="mobile-custom-color-2-label" class="mobile-color-label">Secondary</span>
                </div>
                <div class="mobile-color-picker-wrapper">
                  <input id="mobile-custom-color-3" type="color" value="#ff0000" class="mobile-color-picker" title="Accent" aria-labelledby="mobile-custom-color-3-label">
                  <span id="mobile-custom-color-3-label" class="mobile-color-label">Accent</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <footer class="site-footer">
        <span>&copy; cazucito</span>
        <a href="https://github.com/cazucito/jpc" target="_blank" rel="noopener noreferrer">GitHub</a>
      </footer>

    </main>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
