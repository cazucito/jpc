<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- Browser chrome -->
  <rect width="1280" height="720" fill="#2d2d2d"/>
  <rect x="0" y="0" width="1280" height="40" fill="#3d3d3d"/>
  <circle cx="20" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="20" r="6" fill="#27c93f"/>
  
  <!-- App content -->
  <rect x="0" y="40" width="1280" height="680" fill="#f2ede3"/>
  
  <!-- Header -->
  <rect x="40" y="60" width="1200" height="80" fill="#faf7f1" rx="8"/>
  <text x="80" y="110" font-family="'Playfair Display', Georgia, serif" font-size="36" fill="#1c1914">JPCanvas</text>
  <text x="280" y="110" font-family="'Space Mono', monospace" font-size="14" fill="#7a6e5a">Generative line art</text>
  
  <!-- Palette chips -->
  <rect x="600" y="80" width="60" height="32" fill="#1a1a1a" rx="16"/>
  <rect x="670" y="80" width="60" height="32" fill="#c42525" rx="16"/>
  <rect x="740" y="80" width="60" height="32" fill="#11998e" rx="16"/>
  
  <!-- Canvas frame -->
  <rect x="340" y="160" width="600" height="400" fill="#2d1f0e" rx="4"/>
  <rect x="350" y="170" width="580" height="380" fill="#c4984a"/>
  <rect x="360" y="180" width="560" height="360" fill="#ffffff"/>
  
  <!-- Art lines -->
  <line x1="400" y1="480" x2="880" y2="240" stroke="#1a1a1a" stroke-width="12" stroke-linecap="round"/>
  <line x1="380" y1="300" x2="720" y2="500" stroke="#c42525" stroke-width="10" stroke-linecap="round"/>
  <line x1="500" y1="220" x2="860" y2="400" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Controls panel -->
  <rect x="40" y="160" width="280" height="520" fill="#faf7f1" rx="8"/>
  <text x="60" y="200" font-family="'Space Mono', monospace" font-size="12" fill="#7a6e5a">LINES</text>
  <rect x="60" y="210" width="240" height="8" fill="#ede8de" rx="4"/>
  <rect x="60" y="210" width="144" height="8" fill="#c4984a" rx="4"/>
  
  <text x="60" y="260" font-family="'Space Mono', monospace" font-size="12" fill="#7a6e5a">STROKE</text>
  <rect x="60" y="270" width="240" height="8" fill="#ede8de" rx="4"/>
  <rect x="60" y="270" width="96" height="8" fill="#c4984a" rx="4"/>
  
  <!-- Gallery preview -->
  <rect x="960" y="160" width="280" height="520" fill="#faf7f1" rx="8"/>
  <text x="980" y="200" font-family="'Playfair Display', Georgia, serif" font-size="18" fill="#1c1914">Variations</text>
  <rect x="980" y="220" width="120" height="80" fill="#ffffff" stroke="#ede8de" rx="4"/>
  <rect x="1110" y="220" width="120" height="80" fill="#ffffff" stroke="#ede8de" rx="4"/>
  <rect x="980" y="310" width="120" height="80" fill="#ffffff" stroke="#ede8de" rx="4"/>
  <rect x="1110" y="310" width="120" height="80" fill="#ffffff" stroke="#ede8de" rx="4"/>
</svg>
